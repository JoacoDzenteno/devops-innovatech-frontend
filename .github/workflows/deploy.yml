name: CI/CD Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-front-despacho:latest

      - name: Deploy en servidor
        uses: appleboy/ssh-action@v1
        with:
          host: elservidor.redirectme.net
          username: user1
          password: usuario1
          script: |
            docker stop frontend_despacho || true
            docker rm frontend_despacho || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/innovatech-front-despacho:latest
            docker run -d -p 4173:4173 --name frontend_despacho ${{ secrets.DOCKER_USERNAME }}/innovatech-front-despacho:latest
